<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Pages are prerendered in English. When the visitor's language is Polish, hide the page
			// until the client has switched the text, so English does not flash first.
			// Mirrors the Paraglide strategy: saved choice, then browser language, then English.
			(function () {
				try {
					var saved = localStorage.getItem('PARAGLIDE_LOCALE');
					var locale = saved;
					if (!locale) {
						var languages = navigator.languages || [navigator.language];
						for (var i = 0; i < languages.length; i++) {
							var base = String(languages[i]).slice(0, 2).toLowerCase();
							if (base === 'pl' || base === 'en') {
								locale = base;
								break;
							}
						}
					}
					if (locale && locale !== 'en') {
						document.documentElement.setAttribute('data-pending-locale', locale);
						// Safety net: never keep the page hidden if the app fails to start.
						setTimeout(function () {
							document.documentElement.removeAttribute('data-pending-locale');
						}, 4000);
					}
				} catch (e) {
					/* storage unavailable: show the page as rendered */
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
