<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Filters bottom sheet</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="page m" style="width:390px;height:844px">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
<symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
<symbol id="check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
<symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></symbol>
<symbol id="x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M21 16l-5-5-8 8"/></symbol>
<symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
</defs></svg>

<header class="top" style="height:56px;padding:0 8px;gap:2px">
<button class="btn btn-icon" type="button" aria-label="Menu" style="border:0"><svg class="ic"><use href="#menu"/></svg></button>
<a class="logo" href="#" style="font-size:17px;margin-right:auto;margin-left:2px"><b>PS3</b><i>Digital Legacy</i></a>
<button class="btn btn-icon" type="button" aria-label="Search games" style="border:0"><svg class="ic"><use href="#search"/></svg></button>
<button class="btn btn-icon" type="button" aria-label="Sign in" style="border:0"><svg class="ic"><use href="#user"/></svg></button>
</header>
<div class="strip st-on"><svg class="ic ic-s"><use href="#clock"/></svg><span>Store closes in</span><span class="t">173 d 05:12</span></div>
<div class="wrap" aria-hidden="true">
<h1 class="h1" style="font-size:26px;line-height:32px;margin-bottom:12px">Catalog</h1>
<div class="mrow"><div class="cover"></div><div class="col-f"><div class="ttl">Example action game</div><div class="meta">2009 · Action</div></div></div>
</div>

<div class="ov"></div>

<section class="sheet" style="height:744px;display:flex;flex-direction:column" role="dialog" aria-label="Filters">
<div class="grab"></div>
<div class="row-f" style="padding:8px 16px 8px 20px;border-bottom:1px solid var(--line)">
<h2 class="h3">Filters</h2><span class="muted sm">4 active</span>
<button class="btn btn-icon right" type="button" aria-label="Close filters" style="border:0"><svg class="ic"><use href="#x"/></svg></button>
</div>
<div style="padding:0 20px;flex:1;overflow:hidden">
<div class="fg"><h3>Type</h3>
<div class="opt"><span class="cb on"><svg class="ic"><use href="#check"/></svg></span>Games<span class="n">679</span></div>
<div class="opt"><span class="cb"><svg class="ic"><use href="#check"/></svg></span>DLC<span class="n">3,104</span></div></div>
<div class="fg"><h3>Region</h3>
<div class="row-f wrapf" style="gap:8px"><span class="pill">NA<span class="muted xs">412</span></span><span class="pill on">EU<span class="xs">388</span></span><span class="pill">JP<span class="muted xs">143</span></span></div></div>
<div class="fg"><h3>Genre</h3>
<div class="opt"><span class="cb on"><svg class="ic"><use href="#check"/></svg></span>Action<span class="n">188</span></div>
<div class="opt"><span class="cb"><svg class="ic"><use href="#check"/></svg></span>Adventure<span class="n">121</span></div>
<div class="opt"><span class="cb"><svg class="ic"><use href="#check"/></svg></span>Indie<span class="n">132</span></div>
<div class="opt"><span class="cb"><svg class="ic"><use href="#check"/></svg></span>Puzzle<span class="n">71</span></div></div>
<div class="fg"><h3>Price <span class="muted" style="font-weight:500">in USD</span></h3>
<div class="rng"><i style="left:0;right:35%"></i><b style="left:0"></b><b style="left:65%"></b></div>
<div class="mm"><input class="inp" value="$0" aria-label="Minimum price"><span class="muted">to</span><input class="inp" value="$40" aria-label="Maximum price"></div></div>
<div class="fg"><h3>Store status</h3>
<div class="opt"><span class="cb"><svg class="ic"><use href="#check"/></svg></span>Available<span class="n">512</span></div></div>
</div>
<div class="row-f" style="padding:12px 16px;border-top:1px solid var(--line);background:#fff;gap:12px">
<button class="btn btn-lg" type="button">Clear all</button>
<button class="btn btn-red btn-lg grow" type="button">Show 212 results</button>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
