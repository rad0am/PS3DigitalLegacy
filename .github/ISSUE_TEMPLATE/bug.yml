name: Bug report
description: Something on the site does not work
title: '[Bug] '
labels: ['bug', 'needs-triage']
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
  - type: input
    id: page
    attributes:
      label: Page URL
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 130 on Windows 11, Safari on iPhone 15
  - type: textarea
    id: shots
    attributes:
      label: Screenshots
      description: You can drag and drop images here.
